services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set local development values}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and set local development values}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set local development values}
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "sh",
        "-c",
        "CI=true pnpm install --frozen-lockfile && pnpm db:migrate && pnpm bootstrap:owner && pnpm dev --hostname 0.0.0.0",
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Copy .env.example to .env and set local development values}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: ${PORT:-3000}
      SOURCE_STORAGE_DIRECTORY: /var/lib/receipt-sources
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-}
      BOOTSTRAP_WORKSPACE_NAME: ${BOOTSTRAP_WORKSPACE_NAME:-Casa}
      OCR_ENGINE: ${OCR_ENGINE:-tesseract}
      OCR_DEVICE: ${OCR_DEVICE:-cpu}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - .:/app
      - source-data:/var/lib/receipt-sources
      - node-modules:/app/node_modules
      - next-cache:/app/.next
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "sh",
        "-c",
        "CI=true pnpm install --frozen-lockfile && pnpm db:migrate && pnpm worker:extract",
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Copy .env.example to .env and set local development values}
      NODE_ENV: development
      SOURCE_STORAGE_DIRECTORY: /var/lib/receipt-sources
      OCR_ENGINE: ${OCR_ENGINE:-tesseract}
      OCR_DEVICE: ${OCR_DEVICE:-cpu}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - source-data:/var/lib/receipt-sources
      - node-modules:/app/node_modules
    restart: unless-stopped

volumes:
  postgres-data:
  source-data:
  node-modules:
  next-cache:
